[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imagegenpiper"
version = "0.1.0"
description = "Programmatic CLI for Gemini Web Image Generation via Chrome Extension Bridge"
readme = "README.md"
authors = [{ name = "ImageGenPiper Team" }]
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
imagegenpiper = "cli.main:app"
igp = "cli.main:app"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests/python",
]
pythonpath = [
    ".",
]
