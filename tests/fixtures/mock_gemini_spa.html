<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mock Gemini Web App (ImageGenPiper Test Fixture)</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #131314; color: #e3e3e3; }
    #chat-container { max-width: 800px; margin: 0 auto; }
    .input-wrapper { display: flex; gap: 10px; margin-top: 20px; }
    textarea { width: 100%; height: 60px; background: #1e1f20; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 10px; }
    button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #666; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .generated-card { margin-top: 15px; padding: 10px; background: #1e1f20; border-radius: 8px; }
    .generated-card img { max-width: 100%; border-radius: 6px; }
    .safety-block { color: #f28b82; padding: 10px; border: 1px solid #f28b82; border-radius: 6px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="chat-container">
    <h2>Gemini Web Mock SPA</h2>
    <div id="conversation" data-test-id="chat-history">
      <p>Welcome! Type a prompt to simulate image generation.</p>
    </div>

    <div class="input-wrapper">
      <textarea
        data-test-id="input-textarea"
        placeholder="Ask Gemini to create an image..."
        aria-label="Enter a prompt here"
      ></textarea>
      <button data-test-id="send-button" aria-label="Send message">Send</button>
    </div>
  </div>

  <script>
    const textarea = document.querySelector('[data-test-id="input-textarea"]');
    const sendBtn = document.querySelector('[data-test-id="send-button"]');
    const conversation = document.getElementById('conversation');

    sendBtn.addEventListener('click', () => {
      const prompt = textarea.value.trim();
      if (!prompt) return;

      // Add user turn
      const userTurn = document.createElement('div');
      userTurn.setAttribute('data-test-id', 'conversation-turn');
      userTurn.innerHTML = `<strong>You:</strong> <p>${prompt}</p>`;
      conversation.appendChild(userTurn);

      textarea.value = '';

      // Add loading state
      const loadingDiv = document.createElement('div');
      loadingDiv.setAttribute('data-test-id', 'loading');
      loadingDiv.innerHTML = `<span class="spinner"></span> <span>Generating image with Imagen...</span>`;
      conversation.appendChild(loadingDiv);

      // Simulate generation delay
      setTimeout(() => {
        loadingDiv.remove();

        if (prompt.includes('safety_block')) {
          const blockDiv = document.createElement('div');
          blockDiv.setAttribute('data-test-id', 'safety-warning');
          blockDiv.className = 'safety-block';
          blockDiv.textContent = 'This prompt violates our safety guidelines and was unable to generate.';
          conversation.appendChild(blockDiv);
          return;
        }

        // Mock 1x1 transparent PNG data URI as googleusercontent CDN URL
        const imgCard = document.createElement('div');
        imgCard.className = 'generated-card';
        imgCard.innerHTML = `
          <strong>Gemini:</strong>
          <p>Here is your generated image:</p>
          <img
            src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
            alt="generated image"
            data-test-id="generated-image"
            width="100"
            height="100"
          />
        `;
        conversation.appendChild(imgCard);
      }, 1000);
    });
  </script>
</body>
</html>
